name: Sync to Test (CityUPediaTest)

# 正式版更新/修复同步到测试版：手动触发，把正式版 main 的内容同步到测试版 main
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync CityUPedia main -> CityUPediaTest main
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: python tools/cross_repo_sync.py --src CityUPedia --src-ref main --dst CityUPediaTest --dst-ref main --direction prod_to_test
