    <main class="main-content login-main">
      <header class="top-bar">
        <div class="page-title-wrap">
          <h1 class="top-title" data-i18n="login.title">登录</h1>
          <p class="top-subtitle" data-i18n="login.desc">学生登录后可提交课程评价；管理员登录后可管理云端评价。</p>
        </div>
      </header>

      <section class="login-card" aria-label="登录">
        <div class="login-tabs" role="tablist" aria-label="登录方式">
          <button class="login-tab is-active" type="button" role="tab" aria-selected="true" data-login-mode="student">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            <span data-i18n="login.student">学生登录</span>
          </button>
          <button class="login-tab" type="button" role="tab" aria-selected="false" data-login-mode="admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span data-i18n="login.admin">管理员登录</span>
          </button>
        </div>

        <!-- 学生登录 / 注册 -->
        <div class="login-panel is-active" id="login-panel-student" role="tabpanel">
          <form class="login-form" id="student-form" novalidate>
            <label class="login-field">
              <span class="login-label" data-i18n="login.email">邮箱</span>
              <input id="student-email" type="email" autocomplete="username" placeholder="name@example.com" required>
            </label>
            <label class="login-field">
              <span class="login-label" data-i18n="login.password">密码</span>
              <input id="student-password" type="password" autocomplete="current-password" placeholder="至少 6 位" minlength="6" required>
            </label>
            <label class="login-field" id="student-nickname-field" hidden>
              <span class="login-label" data-i18n="login.nickname">昵称（选填）</span>
              <input id="student-nickname" type="text" maxlength="20" placeholder="登录后评价默认显示的昵称">
            </label>
            <div class="login-actions">
              <button class="button button-primary button-wide" type="submit" id="student-submit">登 录</button>
            </div>
            <div class="login-switch">
              <span id="student-switch-hint" data-i18n="login.noAccount">还没有账号？</span>
              <button class="text-link" type="button" id="student-switch">注册新账号</button>
              <span class="login-switch-sep" aria-hidden="true">·</span>
              <button class="text-link" type="button" id="student-forgot" data-i18n="login.forgot">忘记密码？</button>
            </div>
            <p class="login-status" id="student-status" role="status"></p>
          </form>
          <p class="login-hint" data-i18n="login.studentHint">登录后即可为课程提交评价；你的评价会同步到云端并显示昵称。</p>
        </div>

        <!-- 忘记密码：输入邮箱发送重置邮件 -->
        <div class="login-panel" id="login-panel-forgot" role="tabpanel">
          <form class="login-form" id="forgot-form" novalidate>
            <label class="login-field">
              <span class="login-label" data-i18n="login.email">邮箱</span>
              <input id="forgot-email" type="email" autocomplete="username" placeholder="注册时使用的邮箱" required>
            </label>
            <div class="login-actions">
              <button class="button button-primary button-wide" type="submit" id="forgot-submit" data-i18n="login.sendReset">发送重置邮件</button>
            </div>
            <div class="login-switch">
              <button class="text-link" type="button" id="forgot-back" data-i18n="login.backToLogin">← 返回登录</button>
            </div>
            <p class="login-status" id="forgot-status" role="status"></p>
          </form>
          <p class="login-hint" data-i18n="login.forgotHint">输入注册邮箱后，我们会发送一封密码重置邮件，点击邮件中的链接即可设置新密码。</p>
        </div>

        <!-- 设置新密码：邮箱重置链接回跳后使用 -->
        <div class="login-panel" id="login-panel-reset" role="tabpanel">
          <form class="login-form" id="reset-form" novalidate>
            <label class="login-field">
              <span class="login-label" data-i18n="login.newPassword">新密码</span>
              <input id="reset-password" type="password" autocomplete="new-password" placeholder="至少 6 位" minlength="6" required>
            </label>
            <label class="login-field">
              <span class="login-label" data-i18n="login.confirmPassword">确认新密码</span>
              <input id="reset-password-confirm" type="password" autocomplete="new-password" placeholder="再次输入新密码" minlength="6" required>
            </label>
            <div class="login-actions">
              <button class="button button-primary button-wide" type="submit" id="reset-submit" data-i18n="login.resetPassword">设置新密码</button>
            </div>
            <p class="login-status" id="reset-status" role="status"></p>
          </form>
          <p class="login-hint" data-i18n="login.resetHint">设置成功后即可用新密码登录。</p>
        </div>

        <!-- 管理员登录 -->
        <div class="login-panel" id="login-panel-admin" role="tabpanel">
          <form class="login-form" id="admin-form" novalidate>
            <label class="login-field">
              <span class="login-label" data-i18n="login.email">邮箱</span>
              <input id="admin-email" type="email" autocomplete="username" placeholder="管理员邮箱" required>
            </label>
            <label class="login-field">
              <span class="login-label" data-i18n="login.password">密码</span>
              <input id="admin-password" type="password" autocomplete="current-password" placeholder="密码" required>
            </label>
            <div class="login-actions">
              <button class="button button-primary button-wide" type="submit" id="admin-submit">登 录</button>
            </div>
            <p class="login-status" id="admin-status" role="status"></p>
          </form>
          <p class="login-hint" data-i18n="login.adminHint">管理员登录后可删除任意云端评价；仅限指定管理员邮箱。</p>
        </div>
      </section>
    </main>
